name: BeforeAfter
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant, ja, ko, de, es]
settings:
  base:
    APP_ID: com.hgsldswk.beforeafter
    APP_STORE_ID: "6836673276"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  BeforeAfter:
    type: application
    platform: iOS
    sources:
      - path: BeforeAfter
        excludes: [Fixtures]
      - path: BeforeAfter/Fixtures
        type: folder
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: BeforeAfter AppStore
    info:
      path: BeforeAfter/Info.plist
      properties:
        CFBundleDisplayName: 前后对比拼图
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        NSPhotoLibraryAddUsageDescription: 将你确认保存的对比图添加到照片。
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Before After Preset
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.beforeafter.preset]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.beforeafter.preset
            UTTypeDescription: Before After Preset
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [bapreset]
  BeforeAfterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BeforeAfterTests, Shared, BeforeAfter/ImagePipeline.swift, BeforeAfter/ProjectStore.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  BeforeAfterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BeforeAfterUITests]
    dependencies:
      - target: BeforeAfter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BeforeAfter
schemes:
  BeforeAfter:
    build:
      targets:
        BeforeAfter: all
        BeforeAfterTests: [test]
    test:
      config: Debug
      targets: [BeforeAfterTests]
  BeforeAfterUI:
    build:
      targets:
        BeforeAfter: all
        BeforeAfterUITests: [test]
    test:
      config: Debug
      targets: [BeforeAfterUITests]
